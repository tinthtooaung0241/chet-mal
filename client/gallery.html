<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitchen Asset Gallery</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/src/gallery.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="3D kitchen asset gallery" tabindex="0"></canvas>
      <aside id="panel" aria-label="Kitchen assets">
        <h1>Kitchen assets</h1>
        <p id="status" role="status" aria-live="polite">Loading assets…</p>
        <button id="reset-view" type="button">Reset view</button>
        <nav id="asset-list" aria-label="Focus camera on an asset"></nav>
      </aside>
    </main>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
